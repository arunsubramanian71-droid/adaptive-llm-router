[project]
name = "adaptive-llm-router"
version = "0.1.0"
description = "Provider-agnostic experimental infrastructure for an adaptive LLM cost router"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.10",
]
viz = [
    "matplotlib>=3.8",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# 3.12, not the 3.11 floor in requires-python: numpy's bundled .pyi stubs use
# PEP 695 `type` statements that mypy can only parse when targeting 3.12+.
# This only affects how mypy reads stub syntax, not what language features
# are allowed in our own code (still gated by requires-python).
python_version = "3.12"
packages = ["router"]
ignore_missing_imports = true
